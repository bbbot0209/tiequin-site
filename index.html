<style>
  :root{
    --porcelain:#FDF9F8;
    --blush:#F7E4E9;
    --rose:#FA0C74;
    --plum:#5C4651;
    --gold:#B3883E;
    --gold-light:#DCBE7E;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Jost',-apple-system,sans-serif;
    background:
      radial-gradient(90% 65% at 50% 38%, var(--blush) 0%, rgba(247,228,233,0) 70%),
      var(--porcelain);
    color:var(--plum);
    display:flex;flex-direction:column;align-items:center;
    min-height:100svh;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  main{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:48px 24px 24px;width:100%;
  }
  .logo{
    width:min(540px,84vw);max-width:100%;height:auto;display:block;
    color:var(--rose);
    opacity:0;animation:rise 1.4s cubic-bezier(.2,.6,.2,1) .15s forwards;
  }
  .spark{transform-box:fill-box;transform-origin:center}
  .spark.s1{animation:twinkle 5.6s ease-in-out 2.2s infinite}
  .spark.s2{animation:twinkle 7.4s ease-in-out 3.4s infinite}
  .hairline{
    margin:clamp(28px,5.5vh,52px) 0 clamp(20px,3.5vh,34px);
    display:flex;align-items:center;gap:16px;color:var(--gold);
    opacity:0;animation:appear 1.2s ease .9s forwards;
  }
  .hairline::before,.hairline::after{
    content:"";height:1px;width:72px;
    background:linear-gradient(90deg,rgba(220,190,126,0) 0%,var(--gold-light) 60%,var(--gold) 100%);
    transform:scaleX(0);animation:draw 1.3s cubic-bezier(.3,.6,.2,1) 1s forwards;
  }
  .hairline::before{transform-origin:right}
  .hairline::after{transform-origin:left;background:linear-gradient(90deg,var(--gold) 0%,var(--gold-light) 40%,rgba(220,190,126,0) 100%)}
  .hairline svg{width:11px;height:11px;flex:none}
  .wordline{
    font-weight:400;font-size:clamp(.78rem,2.6vw,.95rem);
    letter-spacing:.52em;text-indent:.52em;text-transform:uppercase;
    color:var(--gold);
    opacity:0;animation:appear 1.2s ease 1.5s forwards;
  }
  .note{
    font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:400;
    font-size:clamp(1.5rem,4.6vw,1.95rem);line-height:1.5;
    margin-top:clamp(26px,4.5vh,42px);max-width:42ch;padding:0 12px;
    opacity:0;animation:appear 1.4s ease 2s forwards;
  }
  .gem{
    position:fixed;z-index:0;pointer-events:none;
    mix-blend-mode:multiply;
    opacity:0;
  }
  .gem-brilliant{
    top:max(-60px,-6vh);right:min(-70px,-5vw);
    width:clamp(260px,34vw,560px);
    --tilt:8deg;--gopacity:.92;
    animation:gemrise 1.8s cubic-bezier(.2,.6,.2,1) 1.2s forwards;
  }
  .gem-b2{
    top:32vh;left:min(-46px,-3vw);
    width:clamp(150px,17vw,280px);
    --tilt:-14deg;--gopacity:.8;
    animation:gemrise 1.8s cubic-bezier(.2,.6,.2,1) 1.5s forwards;
  }
  .gem-b3{
    bottom:max(-44px,-4vh);left:9vw;
    width:clamp(110px,12vw,200px);
    --tilt:-7deg;--gopacity:.74;
    animation:gemrise 1.8s cubic-bezier(.2,.6,.2,1) 1.8s forwards;
  }
  .gem-b4{
    bottom:17vh;right:4vw;
    width:clamp(88px,9vw,150px);
    --tilt:18deg;--gopacity:.68;
    animation:gemrise 1.8s cubic-bezier(.2,.6,.2,1) 2.1s forwards;
  }
  .gem-b5{
    top:5vh;left:4vw;
    width:clamp(64px,7vw,110px);
    --tilt:-22deg;--gopacity:.6;
    animation:gemrise 1.8s cubic-bezier(.2,.6,.2,1) 2.4s forwards;
  }
  main{position:relative;z-index:1}
  @keyframes gemrise{
    from{opacity:0;transform:translateY(24px) rotate(0deg)}
    to{opacity:var(--gopacity,.92);transform:translateY(0) rotate(var(--tilt,0deg))}
  }
  @media (max-width:640px){
    .gem-brilliant{width:52vw;top:-4vw;right:-14vw}
    .gem-b2{width:32vw;left:-10vw;top:36vh}
    .gem-b3{width:26vw;left:2vw;bottom:-6vw}
    .gem-b4,.gem-b5{display:none}
  }
  footer{
    position:relative;z-index:1;
    padding:0 24px 34px;text-align:center;
    font-size:.74rem;letter-spacing:.18em;text-indent:.18em;
    color:#A8949C;
    opacity:0;animation:appear 1.6s ease 2.5s forwards;
  }
  footer a{color:inherit;text-decoration:none;transition:color .3s ease}
  footer a:hover{color:var(--rose)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes appear{to{opacity:1}}
  @keyframes draw{to{transform:scaleX(1)}}
  @keyframes twinkle{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.45;transform:scale(.82)}
  }
  @media (prefers-reduced-motion:reduce){
    .logo,.hairline,.wordline,.note,footer{animation:none;opacity:1}
    .gem{animation:none;opacity:var(--gopacity,.92);transform:rotate(var(--tilt,0deg))}
    .hairline::before,.hairline::after{animation:none;transform:scaleX(1)}
    .spark.s1,.spark.s2{animation:none}
  }
</style>
</head>
